{% set name = "pytest-rerunfailures" %}
{% set version = "16.7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 6956ddfb65ca1d07e7e3d99e2c5359d82300f4cb062e6049563bd2c106f72d5c

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps
  skip: true # [py<310]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=61.0
  run:
    - python
    - packaging >=17.1
    - pytest >=8.2,!=8.2.2

test:
  source_files:
    - tests
  imports:
    - pytest_rerunfailures
  requires:
    - pip
  commands:
    - pip check    
    - pytest -vv tests

about:
  home: https://github.com/pytest-dev/pytest-rerunfailures
  license: MPL-2.0
  license_family: MOZILLA
  license_file: LICENSE
  summary: pytest plugin to re-run tests to eliminate flaky failures
  description: pytest-rerunfailures is a plugin for pytest that re-runs tests to eliminate intermittent failures
  dev_url: https://github.com/pytest-dev/pytest-rerunfailures
  doc_url: https://github.com/pytest-dev/pytest-rerunfailures/blob/master/README.rst

extra:
  recipe-maintainers:
    - pg-hbk
    - sy-hbk
